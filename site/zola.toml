# The MyTube website, built with Zola: `zola --root site serve` to
# preview it, `zola --root site build` to build it into site/public, after
# `go run ./tools/sitedocs`, which makes the docs' pages from docs/*.md, the
# folders of docs/ with a README.md, and CONTRIBUTING.md, CODE_OF_CONDUCT.md
# and SECURITY.md.
#
# templates/index.html is the landing page; static/ holds its stylesheet,
# script and assets, copied as they are, and data/faq.toml the questions
# its FAQ answers. The docs are content/docs, shown by templates/docs and
# styled by static/docs.css.

# GitHub Pages' address.
base_url = "https://bigdaddy284.github.io/mymusic"
title = "MyTube"
description = "Spotify and YouTube Music in one free, open-source desktop player for Windows."
default_language = "en"

# robots.txt is only read at a domain's root: GitHub Pages' copy, under
# /mytube/, has none.
generate_robots_txt = false

# The docs are Markdown for GitHub as much as for the site: what looks like
# a template in them is text.
skip_content_templating = ["docs/**"]

[markdown]
# Headings link to themselves (templates/anchor-link.html).
insert_anchor_links = "heading"
# > [!NOTE] blocks, as GitHub shows them.
github_alerts = true
# The docs' images load as they near the window, beside the page; their
# sizes, which tools/sitedocs reads, keep their room meanwhile.
lazy_async_image = true

[link_checker]
# GitHub's pages make their anchors with a script, which `zola check` does
# not run.
skip_anchor_prefixes = ["https://github.com/"]

[extra]
# The site's one address for search engines, which each page names in its
# canonical link, og:url and sitemap.xml.
canonical_url = "https://bigdaddy284.github.io/mymusic"
