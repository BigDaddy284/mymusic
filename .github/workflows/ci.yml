name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue tests each pull request merged on top of those ahead.
  merge_group:
  # Actions › CI › Run workflow builds any branch by hand, to try it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    # MyTube is built for Windows alone: its tests run on Windows. The job
    # keeps the name the branch's rules require.
    name: Go (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      # The Opus decoder's conformance test decodes the test vectors of RFC
      # 8251. They never change: download them once, and check them.
      - name: Cache the Opus test vectors
        id: opus-vectors
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/opus-vectors
          key: opus-testvectors-rfc8251
      - name: Download the Opus test vectors
        if: steps.opus-vectors.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opus-vectors.tar.gz" https://opus-codec.org/static/testvectors/opus_testvectors-rfc8251.tar.gz
          echo "6b26a22f9ba87b2b836906a9bb7afec5f8e54d49553b1200382520ee6fedfa55  $RUNNER_TEMP/opus-vectors.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opus-vectors"
          # Windows paths start with a drive letter, which GNU tar reads as a remote host.
          cd "$RUNNER_TEMP" && tar -xzf opus-vectors.tar.gz -C opus-vectors
      - name: Test
        run: go test ./...
        env:
          OPUS_TESTVECTORS: ${{ runner.temp }}/opus-vectors/opus_newvectors
      - name: Changelog fragments
        run: go run ./tools/changelog -check

  # The website: the docs' pages made from
  # docs/*.md and the folders of docs with a README.md, which fails on a
  # link to a file the repository lacks, and
  # the site built with Zola, which fails on a broken link between them.
  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - run: nix develop --command go run ./tools/sitedocs
      - run: nix develop --command zola --root site build

  # The release's Windows build, in the Nix shell release.yml builds it in:
  # Ubuntu cross-compiles it, and NSIS makes its installer.
  build:
    name: Build windows/amd64
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tools of flake.nix's shell, at the versions of flake.lock.
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bash .github/scripts/build.sh windows/amd64
      # release.yml finds the installer by this name.
      - name: The installer has the name the release looks for
        run: ls build/windows-*/*-setup-*.exe
      # The release makes it from the build too: try it on every change.
      - name: Package the portable zip
        run: |
          nix develop --command bash .github/scripts/package.sh "$(jq -r .version package.json)" packages
          ls -l packages
      # Windows users can try a change from this artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: |
            build/windows-amd64/*-setup-*.exe
            packages/*.zip
          if-no-files-found: error
          retention-days: 7

  # flake.nix: its lock, and the configuration GoReleaser publishes
  # releases with.
  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: flake.lock is committed, and locks every input
        run: |
          nix flake lock
          if [ -n "$(git status --porcelain -- flake.lock)" ]; then
            cat flake.lock
            echo "flake.lock is missing or out of date: run nix flake lock" >&2
            exit 1
          fi
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - run: bash .github/scripts/nix-retry.sh nix flake check --print-build-logs
      - name: GoReleaser's configuration
        run: nix develop --command goreleaser check
